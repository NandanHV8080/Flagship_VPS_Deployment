server {
    listen 80;
    listen [::]:80;
    server_name vedrion.com www.vedrion.com;

    root /var/www/vedrion;
    index index.html;

    location / {
        try_files $uri $uri/ =404;
    }

    location /api/ {
        proxy_pass http://127.0.0.1:8000/;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
    }
}
