# HTTP: send everything to https://vedrion.com
server {
    listen 80;
    listen [::]:80;
    server_name vedrion.com www.vedrion.com;
    return 301 https://vedrion.com$request_uri;
}

# HTTPS www: send to the main address
server {
    listen 443 ssl http2;
    listen [::]:443 ssl http2;
    server_name www.vedrion.com;

    ssl_certificate     /etc/letsencrypt/live/vedrion.com/fullchain.pem;
    ssl_certificate_key /etc/letsencrypt/live/vedrion.com/privkey.pem;

    return 301 https://vedrion.com$request_uri;
}

# HTTPS main site
server {
    listen 443 ssl http2;
    listen [::]:443 ssl http2;
    server_name vedrion.com;

    ssl_certificate     /etc/letsencrypt/live/vedrion.com/fullchain.pem;
    ssl_certificate_key /etc/letsencrypt/live/vedrion.com/privkey.pem;
    ssl_protocols TLSv1.2 TLSv1.3;
    ssl_session_cache shared:SSL:10m;
    ssl_session_timeout 1d;

    add_header X-Content-Type-Options "nosniff" always;
    add_header X-Frame-Options "SAMEORIGIN" always;
    add_header Referrer-Policy "strict-origin-when-cross-origin" always;

    root /var/www/vedrion;
    index index.html;

    location / {
        try_files $uri $uri/ =404;
    }

    location /api/ {
        proxy_pass http://127.0.0.1:8000/;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-Proto $scheme;
    }
}
